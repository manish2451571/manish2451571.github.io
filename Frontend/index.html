<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="app">
  <header>
    <div class="logo"><i class="fas fa-wallet"></i> ExpenseTracker</div>
    <div class="nav-user">
      <span>Hello, <strong id="user-name"></strong></span>
      <div class="month-box">
        <label>Month:</label>
        <input type="month" id="month-picker"/>
      </div>
      <button class="logout-btn" onclick="logout()">
        <i class="fas fa-sign-out-alt"></i> Logout
      </button>
    </div>
  </header>

  <!-- SUMMARY CARDS -->
  <div class="summary-row">
    <div class="sum-card income"><i class="fas fa-arrow-down"></i><div><span id="s-income">₹0</span><p>Income</p></div></div>
    <div class="sum-card expense"><i class="fas fa-arrow-up"></i><div><span id="s-expense">₹0</span><p>Expenses</p></div></div>
    <div class="sum-card balance"><i class="fas fa-scale-balanced"></i><div><span id="s-balance">₹0</span><p>Balance</p></div></div>
  </div>

  <div class="main-grid">
    <!-- FORM -->
    <div class="card">
      <h3>Add Transaction</h3>
      <div id="form-alert" class="alert hidden"></div>
      <form id="expense-form">
        <div class="form-group">
          <label>Title</label>
          <input type="text" id="f-title" placeholder="e.g. Grocery" required/>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Amount (₹)</label>
            <input type="number" id="f-amount" placeholder="0.00" min="0.01" step="0.01" required/>
          </div>
          <div class="form-group">
            <label>Type</label>
            <select id="f-type">
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Category</label>
            <select id="f-category">
              <option>Food</option><option>Transport</option><option>Shopping</option>
              <option>Health</option><option>Entertainment</option><option>Bills</option>
              <option>Education</option><option>Salary</option><option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="f-date" required/>
          </div>
        </div>
        <div class="form-group">
          <label>Note (optional)</label>
          <input type="text" id="f-note" placeholder="Optional note"/>
        </div>
        <button type="submit" class="btn-primary">Add Transaction</button>
      </form>
    </div>

    <!-- CHARTS -->
    <div class="card charts-card">
      <h3>Spending by Category</h3>
      <div class="chart-wrap"><canvas id="pie-chart"></canvas></div>
      <h3 style="margin-top:24px">Monthly Overview</h3>
      <div class="chart-wrap"><canvas id="bar-chart"></canvas></div>
    </div>
  </div>

  <!-- TRANSACTIONS LIST -->
  <div class="card">
    <div class="list-header">
      <h3>Transactions</h3>
      <input type="text" id="search-tx" placeholder="Search..."/>
    </div>
    <div id="tx-list"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
