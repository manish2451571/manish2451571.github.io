<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Expense Tracker</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="auth-body">

<div class="auth-wrap">

  <!-- LOGO -->
  <div class="auth-logo">
    <i class="fas fa-wallet"></i>
    <span>ExpenseTracker</span>
  </div>

  <!-- CARD -->
  <div class="auth-card" id="auth-card">

    <!-- LOGIN FORM -->
    <div id="login-view">
      <h2>Welcome back 👋</h2>
      <p class="auth-sub">Login to manage your expenses</p>
      <div id="login-alert" class="alert hidden"></div>
      <form id="login-form">
        <div class="form-group">
          <label><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="l-email" placeholder="you@example.com" required/>
        </div>
        <div class="form-group">
          <label><i class="fas fa-lock"></i> Password</label>
          <div class="pass-wrap">
            <input type="password" id="l-pass" placeholder="••••••••" required/>
            <button type="button" class="eye-btn" onclick="togglePass('l-pass', this)">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-primary">Login</button>
      </form>
      <p class="auth-switch">
        Don't have an account?
        <a href="#" onclick="showView('register')">Register</a>
      </p>
    </div>

    <!-- REGISTER FORM -->
    <div id="register-view" class="hidden">
      <h2>Create Account 🚀</h2>
      <p class="auth-sub">Start tracking your expenses today</p>
      <div id="reg-alert" class="alert hidden"></div>
      <form id="register-form">
        <div class="form-group">
          <label><i class="fas fa-user"></i> Full Name</label>
          <input type="text" id="r-name" placeholder="Your name" required/>
        </div>
        <div class="form-group">
          <label><i class="fas fa-envelope"></i> Email</label>
          <input type="email" id="r-email" placeholder="you@example.com" required/>
        </div>
        <div class="form-group">
          <label><i class="fas fa-lock"></i> Password</label>
          <div class="pass-wrap">
            <input type="password" id="r-pass" placeholder="Min 6 characters" required/>
            <button type="button" class="eye-btn" onclick="togglePass('r-pass', this)">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-primary">Create Account</button>
      </form>
      <p class="auth-switch">
        Already have an account?
        <a href="#" onclick="showView('login')">Login</a>
      </p>
    </div>

  </div>
</div>

<script src="auth.js"></script>
</body>
</html>
